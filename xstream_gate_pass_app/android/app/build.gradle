plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.wtss.xstream_gate_pass_app"
    // Explicitly target API 35 (Android 15) for Google Play compliance.
    // Flutter 3.22.2 defaults to 34; overridden here rather than upgrading Flutter.
    compileSdk = 35
    ndkVersion = flutter.ndkVersion
    //Force AndroidX AppCompat Version:
    configurations.all {
            resolutionStrategy {
                force 'androidx.appcompat:appcompat:1.6.1'
            }
        }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.wtss.xstream_gate_pass_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

      signingConfigs {
        create("release") {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"] as String
                keyPassword = keystoreProperties["keyPassword"] as String
                storeFile = file(keystoreProperties["storeFile"] as String)
                storePassword = keystoreProperties["storePassword"] as String
            }
        }
    }

    buildTypes {

        release {
            // Release (Play/CMS) builds are signed with the upload key from
            // android/key.properties. Falls back to debug signing only when that
            // file is absent (e.g. a local `flutter run --release` without keys).
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // Keep R8 off (matches the previously-shipped build). The bundled ML Kit
            // text-recognition plugin references optional language packs that aren't
            // included, which breaks R8 full-mode. Enable later only with keep rules.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('sdk/device.sdk.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1' // Or a newer version
    // Add any other dependencies your app needs
}

